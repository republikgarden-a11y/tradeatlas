name: Gardenz Actuz — collecte gratuite et publication
on:
  schedule:
    - cron: '7 9 * * *'
      timezone: Europe/Paris
    - cron: '37 11 * * *'
      timezone: Europe/Paris
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gardenz-actuz/**'
      - '.github/workflows/gardenz-actuz.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: gardenz-actuz-publication
  cancel-in-progress: false
jobs:
  actualiser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contrôler le collecteur
        run: python -m unittest discover -s gardenz-actuz/scripts -p 'test_*.py'
      - name: Collecter les sources publiques
        id: collecte
        continue-on-error: true
        run: python gardenz-actuz/scripts/refresh.py
      - name: Conserver la collecte et son état
        run: |
          git config user.name 'gardenz-actuz-bot'
          git config user.email 'gardenz-actuz-bot@users.noreply.github.com'
          git add gardenz-actuz/data gardenz-actuz/assets
          if ! git diff --cached --quiet; then
            git commit -m 'Gardenz Actuz : collecte quotidienne des sources'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Préparer Pages
        uses: actions/configure-pages@v5
      - name: Préparer le site complet, application existante conservée
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Signaler un échec de collecte
        if: steps.collecte.outcome == 'failure'
        run: |
          echo '::error::Aucune source accessible. Les archives et la dernière collecte sont conservées.'
          exit 1
